<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratorio Nodo Play</title><style>*{box-sizing:border-box}body{margin:0;background:#1e2b4e;color:#f4f4f4;font:17px 'Helvetica Neue LT Std','Helvetica Neue',Arial,sans-serif}main{max-width:780px;margin:auto;padding:24px}header,footer{padding:16px;text-align:center;color:#45b5db}header img{width:110px}h1{font-size:clamp(28px,5vw,44px)}button,input{font:inherit;padding:14px;border-radius:10px;border:1px solid #45b5db}button{background:#0f4c94;color:white;cursor:pointer;margin:4px}button:disabled{opacity:.65;cursor:default}.primary,.good{background:#cddc0e;color:#1e2b4e}.bad{background:#a6324c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid button{min-height:85px;margin:0;overflow-wrap:anywhere}.hidden{background:#644595;font-size:28px}.panel{background:#ffffff0b;border:1px solid #45b5db66;padding:16px;border-radius:16px;margin:15px 0}.msg{color:#cddc0e;min-height:24px}table{width:100%;border-collapse:collapse;background:#f4f4f4;color:#1e2b4e}td,th{border:1px solid #aaa;padding:10px;text-align:center}input{width:100%;margin:12px 0}a{color:#45b5db}.robot{grid-template-columns:repeat(4,1fr);max-width:380px}.cell{background:#0f4c94;border-radius:8px;aspect-ratio:1;display:grid;place-items:center;font-size:30px}button:focus-visible{outline:3px solid #cddc0e}footer{border-top:1px solid #45b5db55;font-size:13px}</style><header><img src="logo.png" alt="Nodo Tecnológico"><div>NODO PLAY · LABORATORIO</div></header><main><div id="xp">0 XP</div><h1 id="title"></h1><div id="game"></div><p><a href="index.html" target="_top">← Todos los juegos</a></p></main><footer>Dirección de Optimización Administrativa<br>Nodo Tecnológico · Catamarca Capital<br>Conecta, innova y crea futuro.</footer><script>
const type=new URLSearchParams(location.search).get('game')||'excel',g=document.querySelector('#game'),title=document.querySelector('#title');let xp=0,epoch=0;const names={excel:'Excel Master',memory:'Memoria Tech',prompt:'Prompt Master',code:'Código Secreto',cyber:'CiberGuardianes',pc:'Armá tu PC',connect:'Conexión Digital',robot:'Misión Robot',tf:'Verdadero o Falso IA',detect:'Detectives Digitales'};title.textContent=names[type]||'Laboratorio';function add(n){xp+=n;document.querySelector('#xp').textContent=xp+' XP'}function e(tag,t='',cls=''){let x=document.createElement(tag);x.textContent=t;x.className=cls;return x}function b(t,f,c=''){let x=e('button',t,c);x.onclick=f;return x}function clear(){epoch++;g.replaceChildren()}function done(){clear();g.append(e('h2','¡Misión completada!'),e('p',xp+' XP acumulados'),b('Volver a jugar',start,'primary'))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const formulas=[['Sumá las ventas de B2 a B4.',['=SUMA(B2:B4)','=SUM(B2:B4)','=B2+B3+B4'],'45.000','SUMA(B2:B4)'],['Calculá el promedio.',['=PROMEDIO(B2:B4)','=AVERAGE(B2:B4)'],'15.000','PROMEDIO(B2:B4)'],['Encontrá el máximo.',['=MAX(B2:B4)'],'20.000','MAX(B2:B4)'],['Contá las celdas numéricas.',['=CONTAR(B2:B4)','=COUNT(B2:B4)'],'3','CONTAR(B2:B4)'],['Calculá el 10% de B2.',['=B2*10%','=B2/10','=B2*0,1','=B2*0.1'],'1.000','B2*10%']];function excel(i=0){clear();let q=formulas[i],p=e('div','','panel');p.innerHTML='<table><tr><th></th><th>A</th><th>B</th></tr><tr><th>1</th><td>Producto</td><td>Ventas</td></tr><tr><th>2</th><td>Teclado</td><td>10000</td></tr><tr><th>3</th><td>Monitor</td><td>20000</td></tr><tr><th>4</th><td>Mouse</td><td>15000</td></tr><tr><th>5</th><td>Resultado</td><td id="result">?</td></tr></table>';let inp=e('input'),msg=e('p','','msg');inp.placeholder='= ...';let check=b('Comprobar',()=>{if(q[1].includes(inp.value.toUpperCase().replace(/\s/g,''))){add(100);p.querySelector('#result').textContent=q[2];msg.textContent='¡Correcto! +100 XP';check.disabled=inp.disabled=true;g.append(b('Continuar',()=>i+1<formulas.length?excel(i+1):done(),'primary'))}else msg.textContent='Revisá la fórmula e intentá nuevamente.'},'primary');inp.onkeydown=x=>{if(x.key==='Enter'&&!check.disabled)check.click()};g.append(e('p',`Ejercicio ${i+1} de ${formulas.length}`),p,e('h2',q[0]),inp,check,b('Pista',()=>msg.textContent='Probá con ='+q[3]),msg)}
const pairs={memory:[['🤖','🤖'],['💻','💻'],['🧠','🧠'],['🔐','🔐'],['🌐','🌐'],['⚡','⚡']],pc:[['CPU','Procesa instrucciones'],['RAM','Memoria temporal'],['SSD','Almacena archivos'],['Monitor','Muestra imágenes'],['Teclado','Introduce texto'],['GPU','Procesa gráficos']],connect:[['Wi-Fi','Red inalámbrica'],['IoT','Objetos conectados'],['IA','Inteligencia artificial'],['URL','Dirección web'],['Nube','Servidores remotos'],['Backup','Copia de seguridad']]};function memory(){clear();let token=epoch,first=null,lock=false,n=0,moves=0,grid=e('div','','grid'),status=e('p','Parejas: 0/6');shuffle(pairs[type].flatMap((p,id)=>p.map(t=>({t,id})))).forEach(c=>{let x=b('?',()=>{if(lock||x.dataset.open)return;x.dataset.open=1;x.textContent=c.t;x.className='';if(!first){first={x,c};return}moves++;if(first.c.id===c.id){x.className=first.x.className='good';x.disabled=first.x.disabled=true;first=null;n++;add(50);if(n===6)g.append(b('Finalizar',done,'primary'))}else{lock=true;let old=first.x;setTimeout(()=>{if(token!==epoch)return;[old,x].forEach(z=>{z.textContent='?';z.className='hidden';delete z.dataset.open});first=null;lock=false},800)}status.textContent=`Parejas: ${n}/6 · Intentos: ${moves}`},'hidden');grid.append(x)});g.append(e('p','Dá vuelta dos cartas y encontrá las parejas.'),status,grid)}
const seqs={prompt:[['Actuá como docente.','Explicá qué es la IA.','Para estudiantes de 12 años.','Usá tres ejemplos sencillos.'],['Actuá como especialista en marketing.','Redactá una publicación.','Para una panadería de Catamarca.','Incluí un llamado a la acción.']],code:[['Ingresar precio y cantidad','Multiplicar precio por cantidad','Guardar el resultado','Mostrar el total'],['Solicitar edad','Comparar edad con 18','Determinar el resultado','Mostrar el mensaje correspondiente']]};function seq(i=0){clear();let q=seqs[type][i],chosen=[],target=e('div','','panel'),msg=e('p','','msg');g.append(e('p',type==='prompt'?'Ordená las cartas según el esquema rol, tarea, contexto y formato.':'Ordená los pasos del algoritmo.'),target);shuffle(q).forEach(t=>{let x=b(t,()=>{chosen.push(t);x.disabled=true;target.append(e('p',chosen.length+'. '+t))});g.append(x)});let check=b('Comprobar',()=>{if(chosen.length===q.length&&chosen.every((x,j)=>x===q[j])){add(100);check.disabled=true;msg.textContent='¡Correcto!';g.append(b('Continuar',()=>i+1<seqs[type].length?seq(i+1):done(),'primary'))}else msg.textContent='Revisá el orden.'},'primary');g.append(check,b('Reordenar',()=>seq(i)),msg)}
const quizs={cyber:[['Un correo pide tu contraseña bancaria.',['Responder','Verificar por canal oficial','Enviar clave'],1],['¿Qué protege mejor una cuenta?',['Clave corta','Compartir usuario','Autenticación en dos pasos'],2],['Encontrás un USB desconocido.',['No conectarlo','Abrir archivos','Copiar contenido'],0]],tf:[['La IA siempre dice la verdad.',['Verdadero','Falso'],1],['La IA puede generar imágenes.',['Verdadero','Falso'],0],['Conviene compartir datos privados con cualquier IA.',['Verdadero','Falso'],1]],detect:[['Una noticia viral no menciona fuentes.',['Compartir','Buscar fuentes confiables','Creer por sus likes'],1],['Un video parece manipulado.',['Revisar origen y fuentes','Creerlo','Reenviar'],0],['Un premio pide datos bancarios.',['Completar formulario','Invitar amigos','Desconfiar y verificar'],2]]};function quiz(i=0){clear();let q=quizs[type][i],opts=e('div');g.append(e('h2',q[0]),opts);q[1].forEach((t,j)=>opts.append(b(t,()=>{[...opts.children].forEach((x,k)=>{x.disabled=true;x.className=k===q[2]?'good':k===j?'bad':''});if(j===q[2])add(100);g.append(e('p',j===q[2]?'¡Correcto!':'Respuesta correcta: '+q[1][q[2]],'msg'),b('Continuar',()=>i+1<quizs[type].length?quiz(i+1):done(),'primary'))})))}
function robot(){clear();let token=epoch,pos=12,commands=[],running=false,obstacles=[5,9,11],grid=e('div','','grid robot'),target=e('div','','panel'),msg=e('p','','msg');function draw(){grid.replaceChildren();for(let i=0;i<16;i++)grid.append(e('div',i===pos?'🤖':i===3?'⭐':obstacles.includes(i)?'🧱':'·','cell'))}draw();g.append(e('p','Programá una ruta hasta la estrella sin tocar obstáculos.'),grid,target);[['↑',-4],['↓',4],['←',-1],['→',1]].forEach(([t,d])=>g.append(b(t,()=>{if(!running&&commands.length<12){commands.push([t,d]);target.textContent=commands.map(c=>c[0]).join(' ')}})));let run=b('Ejecutar',async()=>{if(running||!commands.length)return;running=true;pos=12;draw();for(let [t,d] of commands){await new Promise(r=>setTimeout(r,350));if(token!==epoch)return;let n=pos+d;if(n<0||n>15||(d===1&&pos%4===3)||(d===-1&&pos%4===0)||obstacles.includes(n)){msg.textContent='Obstáculo. Revisá el programa.';running=false;return}pos=n;draw();if(pos===3){add(200);msg.textContent='¡Meta alcanzada!';run.disabled=true;running=false;g.append(b('Finalizar',done,'primary'));return}}running=false;msg.textContent='Faltan movimientos.'},'primary');g.append(run,b('Borrar programa',()=>{if(!running)robot()}),msg)}function start(){if(type==='excel')excel();else if(pairs[type])memory();else if(seqs[type])seq();else if(type==='robot')robot();else if(quizs[type])quiz()}start();</script></html>
