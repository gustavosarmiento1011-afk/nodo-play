<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exploradores de Catamarca</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4ff;color:#123d78;font:18px Arial,sans-serif}main{max-width:760px;margin:auto;padding:24px}h1{font-size:clamp(25px,5vw,42px)}.panel{background:white;padding:24px;border-radius:24px;box-shadow:0 8px 30px #123d7815}button{font:inherit;font-weight:bold;border:0;border-radius:14px;padding:18px;background:#1359ad;color:white;cursor:pointer;width:100%;margin:6px 0;text-align:left}button:disabled{cursor:default;opacity:.85}button.ok{background:#187747}button.bad{background:#b32635}progress{width:100%;accent-color:#1359ad}#next{background:#123d78;text-align:center}#feedback{min-height:48px;font-weight:bold}button:focus-visible{outline:3px solid orange}body{background:#1e2b4e;color:#f4f4f4;font-family:"Helvetica Neue",Arial,sans-serif}.panel{background:#26385e;border:1px solid #45b5db66}small{color:#45b5db}button{background:#0f4c94}#next{background:#cddc0e;color:#1e2b4e}progress{accent-color:#cddc0e}footer{text-align:center;padding:20px;font-size:13px;color:#f4f4f4}</style><main><small>NODO PLAY · CATAMARCA</small><h1>Exploradores de Catamarca</h1><div class="panel"><div id="status"></div><progress id="progress" max="5" value="0"></progress><h2 id="question"></h2><div id="options"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>Siguiente →</button></div></main><footer>Dirección de Optimización Administrativa · Nodo Tecnológico · Municipalidad de Catamarca Capital</footer><script>const bank=[["¿En qué departamento están las Termas de Fiambalá?", "Tinogasta", "Capital", "Paclín", "Ancasti"], ["¿Qué país limita con Catamarca al oeste?", "Chile", "Bolivia", "Brasil", "Uruguay"], ["¿Dónde se encuentra el Campo de Piedra Pómez?", "Antofagasta de la Sierra", "Valle Viejo", "Fray Mamerto Esquiú", "Capayán"], ["¿Qué localidad es conocida por sus tejidos y ponchos?", "Belén", "Mar del Plata", "Ushuaia", "Rosario"], ["¿Qué provincia limita con Catamarca al sur?", "La Rioja", "Misiones", "Chubut", "Entre Ríos"]];const $=id=>document.getElementById(id);let questions,i,score;function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}function start(){questions=shuffle(bank);i=0;score=0;show()}function show(){$('next').hidden=true;$('feedback').textContent='';$('options').replaceChildren();$('progress').value=i;$('status').textContent=`Pregunta ${i+1} de ${questions.length} · ${score} puntos`;let [q,correct,...wrong]=questions[i];$('question').textContent=q;for(const answer of shuffle([correct,...wrong])){let b=document.createElement('button');b.textContent=answer;b.onclick=()=>{for(const x of $('options').children){x.disabled=true;if(x.textContent===correct)x.classList.add('ok')}if(answer===correct){score+=100;$('feedback').textContent='¡Correcto! +100 puntos'}else{b.classList.add('bad');$('feedback').textContent='La respuesta correcta es: '+correct}$('progress').value=i+1;$('status').textContent=`Pregunta ${i+1} de ${questions.length} · ${score} puntos`;$('next').hidden=false;$('next').textContent=i===questions.length-1?'Ver resultado':'Siguiente →'};$('options').append(b)}}$('next').onclick=()=>{i++;if(i<questions.length){show();return}$('question').textContent='¡Desafío completado!';$('status').textContent='Resultado final';$('options').replaceChildren();$('feedback').textContent=`${score} de ${questions.length*100} puntos · ${score/100} respuestas correctas`;$('next').textContent='Volver a jugar';$('next').onclick=()=>{location.reload()}};start()</script></html>
