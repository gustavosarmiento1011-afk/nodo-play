<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desafío IA</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4ff;color:#123d78;font:18px Arial,sans-serif}main{max-width:760px;margin:auto;padding:24px}h1{font-size:clamp(25px,5vw,42px)}.panel{background:white;padding:24px;border-radius:24px;box-shadow:0 8px 30px #123d7815}button{font:inherit;font-weight:bold;border:0;border-radius:14px;padding:18px;background:#1359ad;color:white;cursor:pointer;width:100%;margin:6px 0;text-align:left}button[hidden]{display:none}button:disabled{cursor:default;opacity:.85}button.ok{background:#187747}button.bad{background:#b32635}progress{width:100%;accent-color:#1359ad}#next{background:#123d78;text-align:center}#feedback{min-height:48px;font-weight:bold}button:focus-visible{outline:3px solid orange}body{background:#1e2b4e;color:#f4f4f4;font-family:"Helvetica Neue",Arial,sans-serif}.panel{background:#26385e;border:1px solid #45b5db66}small{color:#45b5db}button{background:#0f4c94}#next{background:#cddc0e;color:#1e2b4e}progress{accent-color:#cddc0e}footer{text-align:center;padding:20px;font-size:13px;color:#f4f4f4}</style><main><small>NODO PLAY · INTELIGENCIA ARTIFICIAL</small><h1>Desafío IA</h1><div class="panel"><div id="status"></div><progress id="progress" max="5" value="0"></progress><h2 id="question"></h2><div id="options"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>Siguiente →</button></div></main><footer>Dirección de Optimización Administrativa · Nodo Tecnológico · Municipalidad de Catamarca Capital</footer><script>const bank=[["¿Qué hace una IA generativa?", "Crea contenido a partir de instrucciones", "Solo apaga equipos", "Reemplaza internet", "Siempre dice la verdad", "Puede generar textos, imágenes y otros contenidos."], ["¿Qué es un prompt?", "Una instrucción para la IA", "Una batería", "Un cable", "Un virus", "Un prompt comunica la tarea y el contexto."], ["¿Qué conviene hacer con una respuesta de IA?", "Verificar la información", "Creerla siempre", "Publicarla sin leer", "Borrar las fuentes", "La IA puede producir errores convincentes."], ["¿Qué dato no conviene compartir con un chatbot público?", "Una contraseña", "Una pregunta de matemática", "Una receta", "Una idea de cuento", "Las contraseñas son información privada."], ["¿Qué ayuda a entrenar muchos modelos de IA?", "Datos y ejemplos", "Solo electricidad", "Un monitor", "Un teclado", "Los modelos aprenden patrones a partir de datos."], ["¿Qué puede causar sesgos en una IA?", "Datos de entrenamiento poco representativos", "El tamaño del teclado", "El color del monitor", "La marca del cable", "Los datos pueden reflejar desigualdades o prejuicios."], ["¿Qué mejora un prompt?", "Dar contexto y especificar el resultado", "Escribir al azar", "Omitir el objetivo", "Repetir signos", "Las instrucciones claras ayudan a orientar la respuesta."], ["¿Quién debe revisar una decisión importante asistida por IA?", "Una persona responsable", "Nadie", "Solo el teclado", "Un cable USB", "La supervisión humana es importante en decisiones de impacto."]];const $=id=>document.getElementById(id);let questions,i,score;function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}function start(){questions=shuffle(bank);$('progress').max=questions.length;i=0;score=0;show()}function show(){$('next').hidden=true;$('feedback').textContent='';$('options').replaceChildren();$('progress').value=i;$('status').textContent=`Pregunta ${i+1} de ${questions.length} · ${score} puntos`;let [q,correct,w1,w2,w3,explanation]=questions[i];let wrong=[w1,w2,w3];$('question').textContent=q;for(const answer of shuffle([correct,...wrong])){let b=document.createElement('button');b.textContent=answer;b.onclick=()=>{for(const x of $('options').children){x.disabled=true;if(x.textContent===correct)x.classList.add('ok')}if(answer===correct){score+=100;$('feedback').textContent='¡Correcto! +100 puntos'}else{b.classList.add('bad');$('feedback').textContent='La respuesta correcta es: '+correct}$('feedback').textContent+=' · '+explanation;$('progress').value=i+1;$('status').textContent=`Pregunta ${i+1} de ${questions.length} · ${score} puntos`;$('next').hidden=false;$('next').textContent=i===questions.length-1?'Ver resultado':'Siguiente →'};$('options').append(b)}}$('next').onclick=()=>{i++;if(i<questions.length){show();return}$('question').textContent='¡Desafío completado!';$('status').textContent='Resultado final';$('options').replaceChildren();$('feedback').textContent=`${score} de ${questions.length*100} puntos · ${score/100} respuestas correctas`;$('next').textContent='Volver a jugar';$('next').onclick=()=>{location.reload()}};start()</script></html>
